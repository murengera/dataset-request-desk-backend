name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dataset_request_desk_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

    env:
      DJANGO_SECRET_KEY: ci-ephemeral-secret-key-not-for-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: dataset_request_desk_test
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Create Log Directory
        run: mkdir -p ci-logs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django checks
        working-directory: backend
        run: python manage.py check 2>&1 | tee ../ci-logs/django-check.log

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate --noinput 2>&1 | tee ../ci-logs/django-migrate.log

      - name: Seed test data
        working-directory: backend
        run: |
          python manage.py seed_users
          python manage.py import_episodes seed/episodes.csv

      - name: Run test suite
        working-directory: backend
        run: python manage.py test 2>&1 | tee ../ci-logs/django-test-suite.log

      - name: Build Docker image
        run: docker build -t daltonbigirimana5/dataset-request-desk-backend:latest ./backend 2>&1 | tee ci-logs/docker-backend-build.log

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push daltonbigirimana5/dataset-request-desk-backend:latest

      # Capture all container, build, and test logs if anything fails
      - name: Dump Container and Build Logs on Failure
        if: failure()
        run: |
          mkdir -p ci-logs
          docker ps -a > ci-logs/docker-containers-status.txt 2>&1 || true
          docker logs $(docker ps -lq) > ci-logs/docker-container-runtime.log 2>&1 || true
        continue-on-error: true

      - name: Upload Backend Failure Logs Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-failure-logs
          path: ci-logs/
          retention-days: 7

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Create Log Directory
        run: mkdir -p frontend-logs

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build application
        working-directory: frontend
        run: npm run build 2>&1 | tee ../frontend-logs/angular-build.log

      - name: Build Docker image
        run: docker build -t daltonbigirimana5/dataset-request-desk-frontend:latest ./frontend 2>&1 | tee frontend-logs/docker-frontend-build.log

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push daltonbigirimana5/dataset-request-desk-frontend:latest

      # Capture all container, build, and npm logs if frontend fails
      - name: Dump Frontend Container and Build Logs on Failure
        if: failure()
        run: |
          mkdir -p frontend-logs
          docker ps -a > frontend-logs/docker-containers-status.txt 2>&1 || true
          docker logs $(docker ps -lq) > frontend-logs/docker-container-runtime.log 2>&1 || true
          cp frontend/*.log frontend-logs/ 2>/dev/null || true
          cp frontend/npm-debug.log* frontend-logs/ 2>/dev/null || true
        continue-on-error: true

      - name: Upload Frontend Failure Logs Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-failure-logs
          path: frontend-logs/
          retention-days: 7
