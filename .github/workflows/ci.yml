name: CI

on:
  push:
    branches:
       main
  pull_request:
    branches:
      main

# Enforce least-privilege permissions: CI only needs to read repository contents
permissions:
  contents: read

jobs:
  test-and-build:
    name: Backend CI (Test, Check & Build)
    runs-on: ubuntu-latest

    # Ephemeral PostgreSQL service container for integration tests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dataset_request_desk_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    # Environment variables applied to all steps in this job
    env:
      DJANGO_SECRET_KEY: ci-ephemeral-secret-key-not-for-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: dataset_request_desk_test
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      # 1. Check out repository code
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Set up Python runtime with automatic pip caching
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Django system checks (validates configuration, models, urls)
      - name: Run Django system checks
        run: |
          python manage.py check

      # 5. Apply database migrations to test PostgreSQL schema creation
      - name: Apply database migrations
        run: |
          python manage.py migrate --noinput

      # 6. Seed initial test users and episodes
      - name: Seed test data
        run: |
          python manage.py seed_users
          python manage.py import_episodes

      # 7. Run automated test suite
      - name: Run automated test suite
        run: |
          python manage.py test

      # 8. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t daltonbigirimana5/dataset-request-desk:latest .

      # 9. Push to Docker Hub only when code is pushed to main
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push daltonbigirimana5/dataset-request-desk:latest
